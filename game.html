<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖 Tangga Menuju Cinta Wulan Cantik 💖</title>

<link rel="stylesheet" href="game.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<header>

<h1>💖 Tangga Menuju Cinta Wulan Cantik 💖</h1>

<p>
Setiap langkah membawa kita semakin dekat ❤️
</p>

</header>

<div class="game">

<div class="left">

<div id="board">

</div>

</div>

<div class="right">

<div class="card">

<h2>🎲 Dadu</h2>

<div id="dice">
1
</div>

<button id="roll">
Lempar Dadu
</button>

<p id="status">
Menunggu giliran...
</p>

</div>

<div class="card">

<h2>❤️ Love Point</h2>

<div id="lovePoint">

0 ❤️

</div>

</div>

<div class="card">

<h2>💬 Chat</h2>

<div id="chatBox">

<p>Selamat datang ❤️</p>

</div>
<textarea id="jawaban" placeholder="Tulis jawaban di sini..."></textarea>

<button id="kirimJawaban">💖 Kirim Jawaban</button>
<input
type="text"
id="chatInput"
placeholder="Tulis pesan romantis..."
>

<button id="sendChat">

Kirim ❤️

</button>

</div>

</div>

</div>







<div id="popup" class="popup">
    <div class="popup-content">
        <h2>💖 Pertanyaan</h2>

        <p id="popupText"></p>

        <textarea id="jawabanPopup" placeholder="Tulis jawabanmu di sini..."></textarea>
<button id="kirimJawabanPopup">💖 Kirim Jawaban</button>
        <button id="tutupPopup">💌 Tutup</button>
    </div>
</div>
   <script src="game.js"></script> 
</body>

</html>
